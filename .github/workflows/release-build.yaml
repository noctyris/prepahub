name: Release Build

on:
  push:
    tags: ["v*"]

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant : l'APK serait signé avec une clé jetable"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build release APK
        run: flutter build apk --release
        env:
          GIT_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
      - name: Prepare artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk prepahub-${{ github.ref_name }}.apk
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: prepahub-${{ github.ref_name }}.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
